# Clef-Flash 9B QLoRA Configuration for System-1 Joint Schema Classification
model:
  model_id: "Cloudflare/clef-flash"
  model_type: "clef_flash"
  architecture: "joint_schema_decision_engine"
  max_sequence_length: 65536
  max_turns: 25

quantization:
  method: "bitsandbytes"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

peft:
  method: "qlora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  task_type: "SEQ_CLS"

training:
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  num_train_epochs: 3
  precision: "bf16"

hardware:
  device: "cuda"
  target_gpu: "NVIDIA GB10"
  max_memory_allocated_mb: 11000
